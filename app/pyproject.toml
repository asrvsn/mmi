[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mmi-app"
version = "0.1.0"
description = "The operator's window onto the mmi, the stage-top micromanipulator-incubator unit"
requires-python = ">=3.11"
dependencies = [
    "mmi-client>=0.2",   # ../client: the link to the unit, and its rules
    "PyQt6>=6.5",        # the window
    "pyqtgraph>=0.13",   # the plots
    "QtAwesome>=1.3",    # Font Awesome icons
    "numpy",
    "pygame>=2.5",       # the gamepad, through SDL's game-controller layer
    "appnope; sys_platform == 'darwin'",   # App Nap off the timers, on a Mac
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4"]

[tool.setuptools.packages.find]
include = ["mmi_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
