# The mmi conda environment: app/ (mmi_app, the operator's window) and client/ (mmi_client, the library under it). The
# same file on a Mac, a PC or the Raspberry Pi (Miniforge, conda-forge). From this folder:
#   conda env create -f env.yml        (installs both packages in place, from their pyproject.toml)
#   conda activate mmi
# The conda packages are what the two pyproject.toml files ask for, plus the tests'; pip then installs the two
# packages themselves, editable, and finds their dependencies already there.
name: mmi
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pyqt6=6.11        # the window (Qt 6)
  - pyqtgraph=0.14    # the plots
  - qtawesome=1.4     # standard icons (Font Awesome) for the window
  - numpy
  - pygame=2.6        # SDL game controllers (the pad); conda-forge builds it for osx-arm64 and linux-aarch64
  - appnope           # on a Mac, keeps App Nap off the window's timers (does nothing elsewhere)
  - pytest
  - pytest-qt
  - pyyaml            # a test compares the test server's defaults with the firmware's parameters.yaml
  - pip
  - pip:
      - -e ./client
      - -e ./app
